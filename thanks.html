<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お申し込みありがとうございました｜TK Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4f2ec;
    --navy: #14213d;
    --green: #3b6d11;
    --green-soft: #5a9c2f;
    --muted: #78766a;
    --display: "Shippori Mincho", serif;
    --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    --mono: "Roboto Mono", monospace;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--body);
    background: var(--cream);
    color: var(--navy);
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--green);
    margin-bottom: 16px;
  }
  h1 {
    font-family: var(--display);
    font-size: 26px;
    margin: 0 0 16px;
  }
  p { font-size: 14.5px; color: #4a4940; margin: 0 0 30px; }
  a.btn {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 26px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  a.btn:hover { background: var(--green-soft); }
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">TK CAPITAL MARKET RESEARCH</div>
    <h1>お申し込みありがとうございました</h1>
    <p>内容を確認のうえ、追ってご案内のメールをお送りいたします。今しばらくお待ちください。</p>
    <a class="btn" href="index.html">トップページに戻る</a>
  </div>
</body>
</html>
